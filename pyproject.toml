[project]
name = "duyi-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = ["debugpy>=1.8.22", "python-dotenv>=1.2.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["smoke: 标记为冒烟测试，验证核心流程是否正常"]

[tool.test-runner]
test_dirs = ["apps/*/test", "packages/*/test"]
