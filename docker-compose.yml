# PostgreSQL 本地开发数据库 + pgAdmin 管理界面
# 启动：make db-up
# 停止：make db-down
# 验证：make db-verify
services:
  db:
    image: postgres:16
    container_name: learn_pg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123123"
      POSTGRES_DB: learn_db   # 首次启动时自动创建该数据库
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 命名卷，数据持久化
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d learn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learn_pg_admin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
