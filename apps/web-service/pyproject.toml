[project]
name = "web-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi[standard]==0.136.3",
    "loguru>=0.7.3",
    "pyjwt==2.13.0",
    "psycopg2-binary==2.9.12",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = ["smoke: 标记为冒烟测试，验证核心流程是否正常"]
